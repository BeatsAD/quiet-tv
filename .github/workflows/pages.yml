name: Publish installation guide

on:
  push:
    branches: [main]
    paths:
      - prototypes/install-guide/**
      - docs/AGENT.md
      - docs/agent/**
      - docs/AGENT_INSTALL.zh-CN.md
      - docs/AGENT_ADAPT.zh-CN.md
      - docs/DEVICE_ADAPTATION.zh-CN.md
      - scripts/build_install_guide.py
      - scripts/agent_session.py
      - scripts/install_quiet_tv.py
      - scripts/verify_install.py
      - scripts/install_tcl.py
      - scripts/tcl_cast.py
      - scripts/configure_home_guard.py
      - scripts/configure_boot_home.py
      - scripts/device_maintenance.py
      - scripts/device_selftest.py
      - scripts/device_adaptation.py
      - scripts/home_capabilities.py
      - scripts/vendor_adaptation.py
      - scripts/device-presets.json
      - updates/updates.json
      - .github/workflows/pages.yml
  release:
    types: [published, edited, released, unpublished, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Request installation site refresh from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Prepare installation guide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_install_guide.py --output "$RUNNER_TEMP/quiet-tv-pages"
      - name: Upload installation guide
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/quiet-tv-pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
