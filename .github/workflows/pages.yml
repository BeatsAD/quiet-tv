name: Publish installation guide

on:
  push:
    branches: [main]
    paths:
      - prototypes/install-guide/**
      - docs/AGENT.md
      - docs/agent/**
      - docs/AGENT_INSTALL.zh-CN.md
      - docs/AGENT_ADAPT.zh-CN.md
      - docs/DEVICE_ADAPTATION.zh-CN.md
      - scripts/build_install_guide.py
      - scripts/agent_session.py
      - scripts/install_quiet_tv.py
      - scripts/verify_install.py
      - scripts/install_tcl.py
      - scripts/tcl_cast.py
      - scripts/configure_home_guard.py
      - scripts/configure_boot_home.py
      - scripts/device_maintenance.py
      - scripts/boot_ads.py
      - scripts/device_selftest.py
      - scripts/device_adaptation.py
      - scripts/home_capabilities.py
      - scripts/vendor_adaptation.py
      - scripts/device-presets.json
      - updates/updates.json
      - updates/updates-v2.json
      - updates/updates-independent.json
      - .github/workflows/pages.yml
  release:
    types: [published, edited, released, unpublished, deleted]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Request installation site refresh from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Prepare installation guide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_install_guide.py --output "$RUNNER_TEMP/quiet-tv-pages"
      - name: Upload installation guide
        id: upload
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: ${{ runner.temp }}/quiet-tv-pages
      - name: Wait for the Pages artifact
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        shell: bash
        run: |
          if [[ ! "$PAGES_ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Pages upload did not return an artifact ID."
            exit 1
          fi

          for attempt in {1..12}; do
            if visible=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f name="$PAGES_ARTIFACT" --jq '.artifacts[] | select(.expired == false) | .id') &&
              [[ "$visible" == "$PAGES_ARTIFACT_ID" ]]; then
              exit 0
            fi
            if (( attempt < 12 )); then sleep 5; fi
          done

          echo "::error::GitHub did not list the uploaded Pages artifact for this attempt."
          exit 1
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
