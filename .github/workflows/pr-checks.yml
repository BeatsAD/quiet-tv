name: PR checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check contribution and select affected projects
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE"
          elif [ "$EVENT_NAME" = push ] && [[ "$PUSH_BASE" =~ [1-9a-f] ]]; then
            base="$PUSH_BASE"
          else
            base=HEAD^
          fi
          python3 scripts/check_contribution.py --base "$base"
      - name: Validate firmware policy profiles
        if: steps.scope.outputs.android == 'true'
        run: python3 scripts/validate_profiles.py
      - name: Set up Java
        if: steps.scope.outputs.android == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        if: steps.scope.outputs.android == 'true'
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Build and lint public Android source
        if: steps.scope.outputs.android == 'true'
        run: ./gradlew :app:assembleDebug :app:lintDebug --console=plain
