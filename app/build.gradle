plugins { id 'com.android.application' }
def compatibility = providers.gradleProperty('quietCompatibility').getOrElse('standard')
if (!(compatibility in ['standard', 'legacy14', 'legacy19'])) throw new GradleException('Unsupported quietCompatibility')
def legacy = compatibility != 'standard'
def homeMode = providers.gradleProperty('quietHomeMode').getOrElse('standard')
if (!(homeMode in ['standard', 'relay'])) throw new GradleException('Unsupported quietHomeMode')
if (legacy && homeMode != 'standard') throw new GradleException('Android 4.x does not support the relay package')
def launcherId = providers.gradleProperty('quietApplicationId').getOrElse('home.quiet.tv')
if (!(launcherId in ['home.quiet.tv', 'com.coocaa.quiettv', 'com.ts.launcher'])) throw new GradleException('Unsupported quietApplicationId')
if (launcherId == 'com.ts.launcher' && (legacy || homeMode != 'standard')) throw new GradleException('Xiaomi main application requires Android 5+ and standard HOME mode')
if (launcherId == 'com.ts.launcher' && providers.gradleProperty('quietHomeProxy').getOrElse('false') == 'true') throw new GradleException('Xiaomi main application owns HOME; do not build a HOME proxy with it')
def minimumSdk = providers.gradleProperty('quietMinSdk').getOrElse(legacy ? (compatibility == 'legacy14' ? '14' : '19') : '21').toInteger()
if ((legacy && minimumSdk != (compatibility == 'legacy14' ? 14 : 19)) || (!legacy && minimumSdk < 21)) throw new GradleException('Minimum SDK does not match compatibility profile')
// The vendor package name does not require Android 8. Keep API19 on the legacy source set.
android {
    namespace 'home.quiet.tv'
    compileSdk 36
    defaultConfig {
        applicationId launcherId
        minSdk minimumSdk
        if (legacy) multiDexEnabled true
        manifestPlaceholders = [leanbackRequired: !legacy, homeGuardAvailable: !legacy]
        buildConfigField 'boolean', 'LEGACY_19', legacy.toString()
        buildConfigField 'boolean', 'DECLARES_HOME', (homeMode == 'standard').toString()
        resValue 'string', 'home_guard_account_type', launcherId + '.guard'
        buildConfigField 'String', 'UPDATE_COMPATIBILITY', '"' + compatibility + '"'
        buildConfigField 'String', 'UPDATE_ABI', '"' + providers.gradleProperty('quietAbi').getOrElse('universal') + '"'
        targetSdk 36
        versionCode providers.gradleProperty('quietBuildNumber').getOrElse('105').toInteger()
        versionName '1.3.1'
    }
    buildFeatures { buildConfig true }
    // Keep historical source media and superseded generated QR PNGs out of APK assets.
    androidResources {
        ignoreAssetsPatterns.addAll(['big-sur-coastline.jpg', 'big-sur-mountains.jpg',
            'big-sur-road.jpg', 'golden-gate-sunset.jpg', 'golden-gate-sunset.mp4'])
        if (compatibility != 'legacy14') ignoreAssetsPatterns.addAll(['wechat.png', 'qq-group.png'])
    }
    sourceSets.main.java.srcDir(legacy ? 'src/legacy19/java' : 'src/standard/java')
    sourceSets.main.java.srcDir('../home-proxy/src/contract/java')
    // Former clones may retain these local-only files; never compile the retired recorder.
    sourceSets.main.java.exclude 'home/quiet/tv/DiagnosticText.java', 'home/quiet/tv/DiagnosticsActivity.java',
        'home/quiet/tv/DiagnosticsDownloadServer.java', 'home/quiet/tv/DiagnosticsRecorder.java',
        'home/quiet/tv/DiagnosticsSnapshot.java'
    // Retired configuration tools remain as source history; no APK code or dependencies.
    sourceSets.main.java.exclude 'home/quiet/tv/AdbConnectionPanel.java',
        'home/quiet/tv/AdbSession.java',
        'home/quiet/tv/AdbState.java',
        'home/quiet/tv/AdbStateReader.java',
        'home/quiet/tv/BootAdActivity.java',
        'home/quiet/tv/BootAdOperations.java',
        'home/quiet/tv/HomeGuardActivity.java',
        'home/quiet/tv/HomeGuardPanel.java',
        'home/quiet/tv/HomeTakeover.java',
        'home/quiet/tv/LocalAdbDiscovery.java',
        'home/quiet/tv/SetupActivity.java',
        'home/quiet/tv/SetupOperations.java',
        'home/quiet/tv/TclHomePolicy.java',
        'home/quiet/tv/SetupFocus.java',
        'home/quiet/tv/WirelessPairing.java'
    buildTypes {
        debug { debuggable true; buildConfigField 'String', 'UPDATE_CHANNEL', launcherId == 'com.coocaa.quiettv' || homeMode == 'relay' ? '"experimental"' : '"test"' }
        benchmark {
            buildConfigField 'String', 'UPDATE_CHANNEL', launcherId == 'com.coocaa.quiettv' || homeMode == 'relay' ? '"experimental"' : '"test"'
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
        // Formal releases require an explicitly configured persistent signing key.
        release {
            buildConfigField 'String', 'UPDATE_CHANNEL', '"stable"'
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    ['debug', 'benchmark', 'release'].each { name ->
        sourceSets.getByName(name).manifest.srcFile(legacy ? 'src/legacy19/AndroidManifest.xml' : homeMode == 'standard' ? 'src/home/AndroidManifest.xml' : 'src/relay/AndroidManifest.xml')
    }
    def selectedAbi = providers.gradleProperty('quietAbi').getOrElse('universal')
    if (selectedAbi != 'universal') {
        if (!(selectedAbi in ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'])) throw new GradleException('Unsupported quietAbi')
        defaultConfig.ndk.abiFilters.add(selectedAbi)
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
}
dependencies {
    // 1.8 retains Android 5.0 support; legacy19 keeps the platform player.
    if (!legacy) implementation 'androidx.media3:media3-exoplayer:1.8.1'
    if (legacy) implementation 'androidx.multidex:multidex:2.0.1'
    // Removing the pairing dependency exposes older AndroidX jdk7/jdk8 transitives.
    // Align them with the already selected 1.8.22 stdlib, where those classes were merged.
    if (legacy) implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    if (legacy) {
        implementation 'androidx.core:core:1.12.0'
        implementation 'androidx.core:core-ktx:1.12.0'
    }
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation legacy ? 'com.google.zxing:core:3.3.0' : 'com.google.zxing:core:3.5.3'
    implementation legacy ? 'androidx.exifinterface:exifinterface:1.3.7' : 'androidx.exifinterface:exifinterface:1.4.2'
    implementation legacy ? 'androidx.recyclerview:recyclerview:1.3.2' : 'androidx.recyclerview:recyclerview:1.4.0'
    implementation legacy ? 'androidx.activity:activity:1.8.2' : 'androidx.activity:activity:1.10.1'
    if (legacy) implementation 'org.bouncycastle:bctls-jdk15to18:1.86'
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.86'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.86'
    // Local TCP operations only; first-time pairing remains on the computer.
    implementation('com.github.MuntashirAkon:libadb-android:3.1.1') {
        exclude group: 'com.github.MuntashirAkon.spake2-java', module: 'spake2-android'
    }
}

// Ship the reviewed About screen and its offline licenses, without preview controls.
def aboutAssets = layout.buildDirectory.dir('generated/aboutAssets')
android.sourceSets.main.assets.srcDir(aboutAssets)
tasks.register('bundleAbout', Exec) {
    inputs.files('../prototypes/about/index.html', '../prototypes/about/styles.css', '../prototypes/about/app.js', '../prototypes/about/assets/source.svg', '../prototypes/about/assets/wechat.webp', '../prototypes/about/assets/qq-group.webp', '../prototypes/about/assets/wechat.png', '../prototypes/about/assets/qq-group.png')
    inputs.files('../scripts/bundle_about.py', '../LICENSE', '../THIRD_PARTY_NOTICES.md')
    inputs.files(fileTree('src/main/assets/fonts'), fileTree('src/main/assets/licenses'))
    outputs.dir(aboutAssets)
    commandLine 'python3', file('../scripts/bundle_about.py'), aboutAssets.get().dir('about').asFile
}
tasks.named('preBuild').configure { dependsOn 'bundleAbout' }

// Credentials are opt-in build inputs outside Git, never generated Java constants.
def weatherAssets = layout.buildDirectory.dir('generated/weatherAssets')
def localBuildProperties = new Properties()
def localBuildPropertiesFile = rootProject.file('local.properties')
if (localBuildPropertiesFile.isFile()) localBuildPropertiesFile.withReader('UTF-8') { localBuildProperties.load(it) }
def localWeatherConfig = localBuildProperties.getProperty('quietWeatherConfig', '').trim()
def weatherConfigPath = providers.gradleProperty('quietWeatherConfig')
    .orElse(providers.environmentVariable('QUIETTV_WEATHER_CONFIG'))
    .orElse(providers.provider { localWeatherConfig.isEmpty() ? null : localWeatherConfig })
android.sourceSets.main.assets.srcDir(weatherAssets)
tasks.register('bundleWeatherConfiguration') {
    def configuredPath = weatherConfigPath.orNull?.trim()
    def configuration = configuredPath ? file(configuredPath) : null
    if (configuration != null) inputs.file(configuration).withPropertyName('privateWeatherConfiguration')
    inputs.property('weatherConfigured', configuration != null)
    outputs.file(weatherAssets.map { it.file('weather-config.json') })
    doLast {
        def values = configuration == null ? [:] : new groovy.json.JsonSlurper().parse(configuration)
        def host = values.containsKey('qweatherHost') ? values.qweatherHost : ''
        def key = values.containsKey('qweatherApiKey') ? values.qweatherApiKey : ''
        def openWeatherKey = values.containsKey('openWeatherApiKey') ? values.openWeatherApiKey : ''
        if (!(host instanceof String) || !(key instanceof String) || !(openWeatherKey instanceof String)
                || ((!host.isEmpty() || !key.isEmpty()) && (!(host ==~ /[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*\.qweatherapi\.com/) || !(key ==~ /[a-fA-F0-9]{32}/)))
                || (!openWeatherKey.isEmpty() && !(openWeatherKey ==~ /[a-fA-F0-9]{32}/))) {
            throw new GradleException('Invalid private weather configuration')
        }
        def output = weatherAssets.get().file('weather-config.json').asFile
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.toJson(configuration == null ? [:] : [qweatherHost: host, qweatherApiKey: key, openWeatherApiKey: openWeatherKey])
        output.setReadable(false, false)
        output.setReadable(true, true)
    }
}
tasks.named('preBuild').configure { dependsOn 'bundleWeatherConfiguration' }

// A profile switch must invalidate incremental APK packaging, not just its metadata.
// Otherwise a previously packaged Manifest can survive a standard/legacy19 switch.
tasks.configureEach {
    if (name in ['packageDebug', 'packageBenchmark', 'packageRelease']) {
        inputs.property('quietPackageProfile', "${compatibility}:${minimumSdk}:${launcherId}:${homeMode}")
    }
}
