plugins { id 'com.android.application' }
def compatibility = providers.gradleProperty('quietCompatibility').getOrElse('standard')
if (!(compatibility in ['standard', 'legacy19'])) throw new GradleException('Unsupported quietCompatibility')
def legacy = compatibility == 'legacy19'
def launcherId = providers.gradleProperty('quietApplicationId').getOrElse('home.quiet.tv')
if (!(launcherId in ['home.quiet.tv', 'com.coocaa.quiettv'])) throw new GradleException('Unsupported quietApplicationId')
def minimumSdk = providers.gradleProperty('quietMinSdk').getOrElse(legacy ? '19' : '21').toInteger()
if ((legacy && minimumSdk != 19) || (!legacy && minimumSdk < 21)) throw new GradleException('Minimum SDK does not match compatibility profile')
if (launcherId == 'com.coocaa.quiettv' && minimumSdk < 26) throw new GradleException('Coocaa applicationId requires quietMinSdk=26 or newer')
android {
    namespace 'home.quiet.tv'
    compileSdk 36
    defaultConfig {
        applicationId launcherId
        minSdk minimumSdk
        if (legacy) multiDexEnabled true
        manifestPlaceholders = [leanbackRequired: !legacy, homeGuardAvailable: !legacy]
        buildConfigField 'boolean', 'LEGACY_19', legacy.toString()
        targetSdk 36
        versionCode providers.gradleProperty('quietBuildNumber').getOrElse('36').toInteger()
        versionName '1.2.0'
    }
    buildFeatures { buildConfig true }
    sourceSets.main.java.srcDir(legacy ? 'src/legacy19/java' : 'src/standard/java')
    // Former clones may retain these local-only files; never compile the retired recorder.
    sourceSets.main.java.exclude 'home/quiet/tv/DiagnosticText.java', 'home/quiet/tv/DiagnosticsActivity.java',
        'home/quiet/tv/DiagnosticsDownloadServer.java', 'home/quiet/tv/DiagnosticsRecorder.java',
        'home/quiet/tv/DiagnosticsSnapshot.java'
    buildTypes {
        debug { debuggable true }
        benchmark {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
        // Formal releases require an explicitly configured persistent signing key.
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    if (legacy) ['debug', 'benchmark', 'release'].each { name -> sourceSets.getByName(name).manifest.srcFile('src/legacy19/AndroidManifest.xml') }
    def selectedAbi = providers.gradleProperty('quietAbi').getOrElse('universal')
    if (selectedAbi != 'universal') {
        if (!(selectedAbi in ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'])) throw new GradleException('Unsupported quietAbi')
        defaultConfig.ndk.abiFilters.add(selectedAbi)
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
}
dependencies {
    if (legacy) implementation 'androidx.multidex:multidex:2.0.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation legacy ? 'com.google.zxing:core:3.3.0' : 'com.google.zxing:core:3.5.3'
    implementation legacy ? 'androidx.exifinterface:exifinterface:1.3.7' : 'androidx.exifinterface:exifinterface:1.4.2'
    implementation legacy ? 'androidx.recyclerview:recyclerview:1.3.2' : 'androidx.recyclerview:recyclerview:1.4.0'
    implementation legacy ? 'androidx.activity:activity:1.9.3' : 'androidx.activity:activity:1.10.1'
    implementation('com.github.MuntashirAkon:libadb-android:3.1.1') {
        if (legacy) exclude group: 'com.github.MuntashirAkon.spake2-java', module: 'spake2-android'
    }
    if (!legacy) implementation 'org.conscrypt:conscrypt-android:2.7.0'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.86'
}

// Ship the reviewed About screen and its offline licenses, without preview controls.
def aboutAssets = layout.buildDirectory.dir('generated/aboutAssets')
android.sourceSets.main.assets.srcDir(aboutAssets)
tasks.register('bundleAbout', Exec) {
    inputs.files('../prototypes/about/index.html', '../prototypes/about/styles.css', '../prototypes/about/app.js', '../prototypes/about/assets/source.svg', '../prototypes/about/assets/wechat.png', '../prototypes/about/assets/qq-group.png')
    inputs.files('../scripts/bundle_about.py', '../LICENSE', '../THIRD_PARTY_NOTICES.md')
    inputs.files(fileTree('src/main/assets/fonts'), fileTree('src/main/assets/licenses'))
    outputs.dir(aboutAssets)
    commandLine 'python3', file('../scripts/bundle_about.py'), aboutAssets.get().dir('about').asFile
}
tasks.named('preBuild').configure { dependsOn 'bundleAbout' }

// A profile switch must invalidate incremental APK packaging, not just its metadata.
// Otherwise a previously packaged Manifest can survive a standard/legacy19 switch.
tasks.configureEach {
    if (name in ['packageDebug', 'packageBenchmark', 'packageRelease']) {
        inputs.property('quietPackageProfile', "${compatibility}:${minimumSdk}:${launcherId}")
    }
}
