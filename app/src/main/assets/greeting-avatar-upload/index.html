<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiet TV</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head>
<body><main>
  <p class="brand">Quiet TV</p><h1>自定义头像</h1>
  <form id="connect" hidden><label for="code">电视上的六位连接码</label><input id="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" required><button type="submit">连接电视</button></form>
  <section id="editor" hidden aria-label="裁剪头像">
    <div id="crop" aria-label="拖动照片调整位置"><canvas id="canvas" width="512" height="512"></canvas><div class="circle" aria-hidden="true"></div><span id="empty">选择一张喜欢的照片</span></div>
    <div class="zoom-label"><label for="zoom">缩放</label><output id="zoom-value">100%</output></div><input id="zoom" type="range" min="1" max="3" step="0.01" value="1" disabled>
    <input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
    <button type="button" id="choose" class="secondary">选择照片</button>
    <p class="hint" id="requirements">拖动或双指缩放调整  JPG / PNG / 静态 WebP  最大 10 MB</p>
    <button type="button" id="send" disabled>发送到电视</button>
    <p class="hint" id="save-hint">发送后，请在电视上选择“保存”。</p>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
</main></body></html>
