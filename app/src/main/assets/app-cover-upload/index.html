<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Quiet TV 上传应用封面</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head>
<body><main>
<section id="pairing" hidden><h1 id="pair-title">连接电视</h1><form id="pair-form"><label for="code">连接码</label><input id="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6 位数字" autocomplete="one-time-code" required><button id="connect" type="submit">连接电视</button></form><p id="pair-error" role="alert" hidden></p></section>
<section id="editor" hidden><h1 id="editor-title">上传应用封面</h1><p class="intro" id="target"></p><div class="preview"><canvas id="crop" width="720" height="406" aria-label="拖动图片调整封面位置" hidden></canvas><span id="placeholder">选择图片，裁剪后上传</span></div><input id="photo" class="file-input" type="file" accept="image/jpeg,image/png,image/webp"><button id="choose" class="secondary" type="button">选择图片</button>
<div id="crop-controls" hidden><div class="control-label"><label for="zoom">缩放</label><output id="zoom-value">100%</output></div><input id="zoom" type="range" min="1" max="4" value="1" step="0.01"><div class="control-label"><label for="pan-x">水平位置</label><output id="pan-x-value">50%</output></div><input id="pan-x" type="range" min="0" max="100" value="50"><div class="control-label"><label for="pan-y">垂直位置</label><output id="pan-y-value">50%</output></div><input id="pan-y" type="range" min="0" max="100" value="50"></div>
<p id="fileinfo">推荐 720 × 406 px 最低 360 × 203 px<br>JPG / PNG / 静态 WebP 单张不超过 2 MB</p><p class="intro" id="ai-hint">可用 AI 辅助生成应用封面，按上述尺寸导出。</p><button id="send" type="button" disabled>上传到电视</button><div id="progress" role="progressbar" aria-label="上传进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><span></span></div><p id="status" role="status" aria-live="polite"></p><p id="error" role="alert" hidden></p></section>
<section id="success" hidden><div class="check" aria-hidden="true">✓</div><h1>封面已发送</h1><p class="intro">请在电视上确认应用，确认前保留原封面。</p><img id="result" alt="已发送的应用封面"></section>
</main></body></html>
