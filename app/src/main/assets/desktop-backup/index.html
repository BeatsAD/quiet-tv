<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quiet TV 桌面备份</title><link rel="stylesheet" href="styles.css"></head><body><main><p class="brand">QUIET TV</p><h1>桌面备份</h1><section id="connect"><form id="connection"><label for="code">电视连接码</label><div class="row"><input id="code" inputmode="numeric" autocomplete="off" maxlength="6" pattern="[0-9]{6}" required aria-describedby="connection-note"><button id="connect-button">连接电视</button></div></form><p id="connection-note" class="muted">输入电视当前显示的六位连接码。</p></section><section id="transfer" hidden><h2 id="heading"></h2><div id="export" hidden><p id="file-name"></p><p id="detail" class="muted"></p><a id="download" class="button" download>下载备份</a></div><div id="import" hidden><label for="file">选择桌面备份</label><input id="file" type="file" accept=".json,.zip,application/json,application/zip"><p class="muted">选择配置文件，或包含素材的 ZIP 备份。</p><button id="upload" disabled>传到电视</button><progress id="progress" max="100" value="0" hidden aria-label="备份传输进度"></progress></div></section><p id="status" role="status" aria-live="polite"></p><footer>导入后请在电视确认保存，恢复时会再次确认。</footer></main><script src="app.js" defer></script></body></html>
