<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Quiet TV  上传壁纸</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
<main>
  <section id="pairing" aria-labelledby="pair-title" hidden>
    <h1 id="pair-title">连接电视</h1>
    <form id="pair-form">
      <label for="code">连接码</label>
      <input id="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6 位数字" autocomplete="one-time-code" required>
      <button id="connect" type="submit">连接电视</button>
    </form>
    <p id="pair-error" role="alert" hidden></p>
  </section>
  <section id="editor" aria-labelledby="editor-title" hidden>
    <h1 id="editor-title">上传壁纸</h1>
    <label class="preview" for="photo">
      <input id="photo" class="file-input" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,video/x-matroska,video/webm,.mp4,.mov,.mkv,.webm" aria-label="选择壁纸图片或视频">
      <img id="preview" alt="待上传壁纸预览" hidden>
      <video id="video-preview" muted playsinline controls preload="metadata" aria-label="待上传视频预览" hidden></video>
      <span id="placeholder"><span class="plus" aria-hidden="true">＋</span><span class="placeholder-text">选择图片或视频</span></span>
      <span class="change" id="change" hidden>更换文件</span>
    </label>
    <p id="fileinfo">图片  JPG / PNG / 静态 WebP  最大 60 MB<br>视频  MP4 / MOV / MKV / WebM  最大 200 MB  60 FPS</p>
    <div id="naming" hidden>
      <label id="name-label" for="wallpaper-name">壁纸名称</label>
      <input id="wallpaper-name" type="text" maxlength="48" autocomplete="off" spellcheck="false" enterkeyhint="done" aria-describedby="name-hint name-error">
      <div class="name-meta"><span id="name-hint">不修改则保留原名</span><span id="name-count">0/48</span></div>
      <p id="name-error" role="alert" hidden></p>
    </div>
    <button id="send" disabled>上传到电视</button>
    <button id="cancel" type="button" hidden>取消上传</button>
    <div id="progress" role="progressbar" aria-label="上传进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><span></span></div>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="error" role="alert" hidden></p>
  </section>
  <section id="success" aria-labelledby="success-title" hidden>
    <div class="check" aria-hidden="true">✓</div>
    <h1 id="success-title">上传成功</h1>
    <p class="intro">在电视按返回，选择壁纸预览并使用。</p>
    <img id="result" alt="已上传的壁纸">
    <video id="result-video" muted playsinline controls preload="metadata" aria-label="已上传视频" hidden></video>
    <p id="result-status" class="intro" role="status" aria-live="polite" hidden></p>
    <button id="another">继续上传</button>
  </section>
</main>
</body>
</html>
