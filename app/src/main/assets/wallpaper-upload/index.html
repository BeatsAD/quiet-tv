<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Quiet TV  上传壁纸</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
<main>
  <section id="pairing" aria-labelledby="pair-title" hidden>
    <h1 id="pair-title">连接电视</h1>
    <form id="pair-form">
      <label for="code">连接码</label>
      <input id="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6 位数字" autocomplete="one-time-code" required>
      <button id="connect" type="submit">连接电视</button>
    </form>
    <p id="pair-error" role="alert" hidden></p>
  </section>
  <section id="editor" aria-labelledby="editor-title" hidden>
    <h1 id="editor-title">上传壁纸</h1>
    <label class="choose" for="photo" id="choose-label">选择图片或视频（可多选）</label>
    <input id="photo" class="file-input" type="file" multiple accept="image/jpeg,image/png,image/webp,video/*,.mp4,.mov,.mkv,.webm,.m4v,.3gp,.3g2,.ts,.m2ts,.mts,.mpg,.mpeg,.vob,.flv" aria-label="选择壁纸图片或视频（可多选）">
    <p id="fileinfo"></p>
    <ul id="queue" aria-label="壁纸上传列表"></ul>
    <button id="send" disabled>上传并保存全部</button>
    <button id="cancel" type="button" hidden>取消上传</button>
    <div id="progress" role="progressbar" aria-label="上传进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><span></span></div>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="error" role="alert" hidden></p>
  </section>
</main>
</body>
</html>
