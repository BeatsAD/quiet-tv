pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral(); maven { url 'https://jitpack.io'; content { includeGroup 'com.github.MuntashirAkon'; includeGroup 'com.github.MuntashirAkon.spake2-java' } } } }
rootProject.name = 'QuietTV'
include ':app'

// Private test fixtures are optional; a fresh clone builds only the public app.
['management-fixture', 'home-fixture'].each { name ->
    if (file(name + '/build.gradle').isFile()) include ':' + name
}

apply from: 'gradle/security-constraints.gradle'
