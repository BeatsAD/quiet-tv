// Minimum patched versions for build tools and application cryptography dependencies.
// Constraints upgrade existing modules without adding them to the APK or downgrading newer versions.
def minimumVersions = [
    'org.bouncycastle:bcprov-jdk15to18': '1.86',
    'org.bouncycastle:bcpkix-jdk15to18': '1.86',
    'org.bouncycastle:bcutil-jdk15to18': '1.86',
    'org.bouncycastle:bcprov-jdk18on': '1.85',
    'org.bouncycastle:bcpkix-jdk18on': '1.85',
    'org.bouncycastle:bcutil-jdk18on': '1.85',
    'com.google.protobuf:protobuf-java': '3.25.5',
    'com.google.protobuf:protobuf-java-util': '3.25.5',
    'com.google.protobuf:protobuf-kotlin': '3.25.5',
    'org.apache.commons:commons-compress': '1.28.0',
    'org.bitbucket.b_c:jose4j': '0.9.6',
    'org.jdom:jdom2': '2.0.6.1'
]
[
    'netty-buffer', 'netty-codec', 'netty-codec-http', 'netty-codec-http2',
    'netty-codec-socks', 'netty-common', 'netty-handler', 'netty-handler-proxy',
    'netty-resolver', 'netty-transport', 'netty-transport-native-unix-common'
].each { name -> minimumVersions["io.netty:${name}"] = '4.1.137.Final' }

def addSecurityConstraints = { configurations, dependencies ->
    def security = configurations.create('securityConstraints') {
        canBeResolved = false
        canBeConsumed = false
    }
    minimumVersions.each { module, version ->
        dependencies.constraints.add(security.name, "${module}:${version}") {
            because 'Minimum patched versions for build tools and application cryptography'
        }
    }
    configurations.configureEach { configuration ->
        if (configuration != security) configuration.extendsFrom(security)
    }
}

gradle.beforeProject { target ->
    addSecurityConstraints(target.buildscript.configurations, target.buildscript.dependencies)
    addSecurityConstraints(target.configurations, target.dependencies)
}
