plugins {
    id 'com.android.application'
}
def launcherId = providers.gradleProperty('quietApplicationId').getOrElse('home.quiet.tv')
if (!(launcherId in ['home.quiet.tv', 'com.coocaa.quiettv'])) throw new GradleException('Unsupported quietApplicationId')

android {
    namespace 'com.ccos.tv.homepage'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ccos.tv.homepage'
        // Below 26 so the boot watch may run as a plain background service on Android 8.
        minSdk 21
        targetSdk 25
        versionCode 11
        versionName '2.0'
        manifestPlaceholders = [quietLauncherPackage: launcherId]
        buildConfigField 'String', 'LAUNCHER_PACKAGE', '"' + launcherId + '"'
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
